[project]
name = "newsmon"
version = "0.1.0"
description = "Keyless breaking-news TUI"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
newsmon = "newsmon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# BLE makes the `# noqa: BLE001` pragmas on the deliberate blanket excepts live.
select = ["E", "F", "BLE"]
ignore = ["E501"]  # long, readable test-data lines
